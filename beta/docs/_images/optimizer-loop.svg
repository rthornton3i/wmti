<svg xmlns="http://www.w3.org/2000/svg" font-family="sans-serif" font-size="14" viewBox="0 0 760 130" role="img"><title>The optimizer loop</title><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#5b7a99"/></marker></defs><rect x="10" y="40" width="120" height="44" rx="8" fill="#eef3f8" stroke="#5b7a99"/><text x="70" y="67" text-anchor="middle" fill="#1f2d3a">Strategy list</text><path d="M130 62 L150 62" stroke="#5b7a99" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="150" y="40" width="120" height="44" rx="8" fill="#eef3f8" stroke="#5b7a99"/><text x="210" y="67" text-anchor="middle" fill="#1f2d3a">Candidate settings</text><path d="M270 62 L290 62" stroke="#5b7a99" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="290" y="40" width="130" height="44" rx="8" fill="#eef3f8" stroke="#5b7a99"/><text x="355" y="67" text-anchor="middle" fill="#1f2d3a">Same random draws</text><path d="M420 62 L440 62" stroke="#5b7a99" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="440" y="40" width="100" height="44" rx="8" fill="#eef3f8" stroke="#5b7a99"/><text x="490" y="67" text-anchor="middle" fill="#1f2d3a">Score</text><path d="M540 62 L560 62" stroke="#5b7a99" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="560" y="40" width="90" height="44" rx="8" fill="#eef3f8" stroke="#5b7a99"/><text x="605" y="67" text-anchor="middle" fill="#1f2d3a">Keep best</text><path d="M650 62 L670 62" stroke="#5b7a99" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="670" y="40" width="80" height="44" rx="8" fill="#eef3f8" stroke="#5b7a99"/><text x="710" y="67" text-anchor="middle" fill="#1f2d3a">Re-check</text><text x="380" y="115" text-anchor="middle" fill="#1f2d3a">The best settings are re-checked on fresh draws</text></svg>
