<svg xmlns="http://www.w3.org/2000/svg" font-family="sans-serif" font-size="14" viewBox="0 0 720 220" role="img"><title>The three tabs</title><rect x="30" y="10" width="200" height="200" rx="14" fill="#fff" stroke="#5b7a99" stroke-width="2"/><rect x="30" y="10" width="200" height="36" rx="14" fill="#eef3f8" stroke="#5b7a99" stroke-width="2"/><text x="130" y="34" text-anchor="middle" font-weight="bold" fill="#1f2d3a">Setup</text><text x="130" y="120" text-anchor="middle" fill="#1f2d3a">Open and save scenarios</text><rect x="270" y="10" width="200" height="200" rx="14" fill="#fff" stroke="#5b7a99" stroke-width="2"/><rect x="270" y="10" width="200" height="36" rx="14" fill="#eef3f8" stroke="#5b7a99" stroke-width="2"/><text x="370" y="34" text-anchor="middle" font-weight="bold" fill="#1f2d3a">Inputs</text><text x="370" y="120" text-anchor="middle" fill="#1f2d3a">Enter your plan, one chip per group</text><rect x="510" y="10" width="200" height="200" rx="14" fill="#fff" stroke="#5b7a99" stroke-width="2"/><rect x="510" y="10" width="200" height="36" rx="14" fill="#eef3f8" stroke="#5b7a99" stroke-width="2"/><text x="610" y="34" text-anchor="middle" font-weight="bold" fill="#1f2d3a">Outputs</text><text x="610" y="120" text-anchor="middle" fill="#1f2d3a">Run and read the results</text></svg>
