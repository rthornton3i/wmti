<svg xmlns="http://www.w3.org/2000/svg" font-family="sans-serif" font-size="14" viewBox="0 0 720 120" role="img"><title>How the planner works</title><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#5b7a99"/></marker></defs><rect x="10" y="40" width="130" height="44" rx="8" fill="#eef3f8" stroke="#5b7a99"/><text x="75" y="67" text-anchor="middle" fill="#1f2d3a">Your household</text><path d="M140 62 L160 62" stroke="#5b7a99" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="160" y="40" width="190" height="44" rx="8" fill="#eef3f8" stroke="#5b7a99"/><text x="255" y="67" text-anchor="middle" fill="#1f2d3a">Each year: income, tax, spending</text><path d="M350 62 L370 62" stroke="#5b7a99" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="370" y="40" width="160" height="44" rx="8" fill="#eef3f8" stroke="#5b7a99"/><text x="450" y="67" text-anchor="middle" fill="#1f2d3a">Many random markets</text><path d="M530 62 L550 62" stroke="#5b7a99" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="550" y="40" width="150" height="44" rx="8" fill="#eef3f8" stroke="#5b7a99"/><text x="625" y="67" text-anchor="middle" fill="#1f2d3a">Results and charts</text></svg>
